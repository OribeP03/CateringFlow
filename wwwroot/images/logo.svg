<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Warm Gold / Copper Gradient for Line Artwork -->
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4944c" />
      <stop offset="50%" stop-color="#b87333" />
      <stop offset="100%" stop-color="#96561d" />
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b87333" />
      <stop offset="50%" stop-color="#a46327" />
      <stop offset="100%" stop-color="#834814" />
    </linearGradient>

    <!-- Ribbon Shadow / Fold -->
    <linearGradient id="ribbonDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e390c" />
      <stop offset="100%" stop-color="#4a2505" />
    </linearGradient>

    <!-- Subtle White Fill with slight opacity for Hat Interior -->
    <linearGradient id="hatFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#faf5ed" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 10)">
    <!-- 1. CHEF HAT PUFFS (Interior Fill) -->
    <path d="M 145 155 
             C 120 155 105 130 110 105 
             C 112 85 130 70 148 72 
             C 152 45 180 25 210 28 
             C 235 30 255 48 260 70 
             C 278 68 296 82 298 102 
             C 300 128 285 155 260 155 Z" 
          fill="url(#hatFill)" />

    <!-- 2. CHEF HAT PUFFS (Outer Contour Lines - Hand Drawn Look) -->
    <path d="M 145 155 
             C 120 155 105 130 110 105 
             C 112 85 130 70 148 72 
             C 152 45 180 25 210 28 
             C 235 30 255 48 260 70 
             C 278 68 296 82 298 102 
             C 300 128 285 155 260 155" 
          fill="none" 
          stroke="url(#goldStroke)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Chef Hat Pleats / Inner Texture Lines -->
    <path d="M 158 85 C 165 110 172 135 175 152" fill="none" stroke="url(#goldStroke)" stroke-width="3" stroke-linecap="round" />
    <path d="M 205 45 C 206 80 206 120 205 150" fill="none" stroke="url(#goldStroke)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 248 80 C 242 108 238 132 235 152" fill="none" stroke="url(#goldStroke)" stroke-width="3" stroke-linecap="round" />
    <path d="M 180 60 C 185 85 188 115 190 145" fill="none" stroke="url(#goldStroke)" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <path d="M 226 58 C 223 85 220 115 218 145" fill="none" stroke="url(#goldStroke)" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

    <!-- 3. CHEF HAT BAND / BASE -->
    <path d="M 145 150 L 152 175 C 185 182 220 182 253 175 L 260 150 Z" 
          fill="url(#hatFill)" 
          stroke="url(#goldStroke)" 
          stroke-width="4.5" 
          stroke-linejoin="round" />
    <path d="M 150 162 C 185 170 220 170 255 162" fill="none" stroke="url(#goldStroke)" stroke-width="2.5" />

    <!-- 4. SERVING DISH / PLATE -->
    <!-- Outer Plate Rim -->
    <ellipse cx="202" cy="182" rx="115" ry="26" 
             fill="url(#hatFill)" 
             stroke="url(#goldStroke)" 
             stroke-width="5" />

    <!-- Inner Plate Rim Line -->
    <ellipse cx="202" cy="184" rx="88" ry="18" 
             fill="none" 
             stroke="url(#goldStroke)" 
             stroke-width="3" />

    <!-- Plate Bottom Base Curve -->
    <path d="M 125 188 C 145 205 260 205 280 188" 
          fill="none" 
          stroke="url(#goldStroke)" 
          stroke-width="3.5" 
          stroke-linecap="round" />

    <!-- 5. RIBBON BANNER -->
    <!-- Ribbon Left Fold / Under -->
    <polygon points="58,238 88,205 88,255" fill="url(#ribbonDark)" />
    <!-- Ribbon Left Tail with swallowtail notch -->
    <path d="M 88 205 L 35 210 L 58 238 L 35 268 L 88 255 Z" fill="url(#ribbonGrad)" stroke="url(#goldStroke)" stroke-width="2" />

    <!-- Ribbon Right Fold / Under -->
    <polygon points="346,238 316,205 316,255" fill="url(#ribbonDark)" />
    <!-- Ribbon Right Tail with swallowtail notch -->
    <path d="M 316 205 L 369 210 L 346 238 L 369 268 L 316 255 Z" fill="url(#ribbonGrad)" stroke="url(#goldStroke)" stroke-width="2" />

    <!-- Ribbon Main Center Banner Curve -->
    <path d="M 78 214 
             C 150 196 254 196 326 214 
             L 326 264 
             C 254 246 150 246 78 264 Z" 
          fill="url(#ribbonGrad)" 
          stroke="url(#goldStroke)" 
          stroke-width="3" />

    <!-- 6. EMBLEM ACCENT -->
    <polygon points="202,233 205,239 212,239 206,244 208,251 202,246 196,251 198,244 192,239 199,239" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
